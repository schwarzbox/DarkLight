name: CI

env:
  GODOT_VERSION: 4.6.2

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  export-web:
    name: Web Export

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write

    container:
      image: barichello/godot-ci:4.6.2

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: HTML5 Build
        run: |
          mkdir -p build/web
          godot --headless --verbose --export-release "HTML5" build/web/index.html

      # SharedArrayBuffer workaround for GitHub Pages
      - name: Setup COI service worker
        run: |
          apt-get update && apt-get install -y curl
          cd build/web
          curl -fsSL https://github.com/gzuidhof/coi-serviceworker/raw/master/coi-serviceworker.js \
            -o coi-serviceworker.js

          sed -i 's#<script src="index.js"></script>#<script src="coi-serviceworker.js"></script>\n<script src="index.js"></script>#g' index.html

      - name: Install rsync
        run: |
          apt-get update && apt-get install -y rsync

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
